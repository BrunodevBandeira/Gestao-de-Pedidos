version: "3.1"
services:
  db:
    image: mysql
    container_name: mysql_product_service
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
    - "3306:3306"
    volumes:
     - product_data:/var/lib/mysql

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitMQ_product
    ports:
      - "15672:15672"
      - "5672:5672"
    volumes:
      - rabbitmq_product_service:/var/lib/rabbitmq
volumes:
  product_data:
  rabbitmq_product_service:
