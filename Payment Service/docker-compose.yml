version: "3.1"
services:
  db:
    image: mysql
    container_name: mysql_payment
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - payment_data:/var/lib/mysql
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq_payment
    ports:
      - "15672:15672"
      - "5672:5672"
    volumes:
      - rabbitmq_payment_service:/var/lib/rabbitmq
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
volumes:
  payment_data:
  rabbitmq_payment_service:
  redis_data:
